name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.11
      - name: Python offline tests
        env:
          PYTHONPATH: 'src:.'
        run: |
          .venv/bin/python -m unittest discover -s tests
          for suite in tools/*/tests; do
            if test -d "$suite"; then
              .venv/bin/python -m unittest discover -s "$suite"
            fi
          done
      - name: Firmware V2 host simulation and deterministic fixtures
        run: |
          .venv/bin/python scripts/run_fsr2_host_tests.py
          .venv/bin/python scripts/check_fsr2_frames.py
          git diff --exit-code -- tests/fixtures/fsr2
